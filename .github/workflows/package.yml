name: CI & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate manifest.json syntax
        run: |
          jq . manifest.json > /dev/null
          echo "manifest.json is valid JSON"

      - name: Verify essential extension files exist
        run: |
          for f in manifest.json popup.html popup.js content.js inject.js play_guard.js icons/16.png icons/48.png icons/128.png; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
          done
          echo "All extension files verified"

      - name: Build extension zip artifact
        run: |
          zip -r google-extension-pro-toolkit.zip \
            manifest.json \
            popup.html \
            popup.js \
            content.js \
            inject.js \
            play_guard.js \
            icons/ \
            README.md \
            LICENSE

      - name: Upload extension package artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-extension-pro-toolkit
          path: google-extension-pro-toolkit.zip

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: google-extension-pro-toolkit.zip
          generate_release_notes: true
